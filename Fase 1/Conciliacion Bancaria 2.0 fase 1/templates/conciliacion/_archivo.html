<div class="archivo" data-archivo>
    <label class="archivo__zona">
        <input class="archivo__entrada" type="file" id="{{ campo }}" name="{{ campo }}" accept="{{ acepta }}"{% if multiple %} multiple{% endif %}
               data-nombre="{{ titulo }}"{% if requiere %} data-requiere="{{ requiere }}"{% endif %}{% if obligatorio %} data-obligatorio{% endif %}>
        <span class="archivo__icono"><i data-lucide="{{ icono }}" aria-hidden="true"></i></span>
        <span class="archivo__nombre">{{ titulo }}{% if obligatorio %} <span class="archivo__marca">Obligatorio</span>{% endif %}</span>
        <span class="archivo__detalle" data-detalle data-vacio="{{ ayuda }}">{{ ayuda }}</span>
    </label>
    <button type="button" class="archivo__quitar" data-quitar aria-label="Quitar el archivo de {{ titulo }}">
        <i data-lucide="x" aria-hidden="true"></i>
    </button>
</div>
